[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-helper"
version = "1.0.0"
description = "Generate effective prompts for Claude Code based on repository analysis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Claude Code Helper"}
]
keywords = ["claude", "ai", "prompt", "code", "assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pathspec>=0.11.0",
    "gitpython>=3.1.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
claude-helper = "src.cli:main"

[project.urls]
Homepage = "https://github.com/anthropics/claude-code-helper"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
